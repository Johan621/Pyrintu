name: Pyrintu API tests

on:
  pull_request:
    paths:
      - "services/api/**"
      - "services/intent/**"
      - "services/discovery/**"
      - ".github/workflows/api-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/intent/**"
      - "services/discovery/**"
      - ".github/workflows/api-tests.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./pyrintu-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install domain packages and API
        run: |
          python -m pip install --upgrade pip
          pip install -e services/intent
          pip install -e services/discovery
          pip install -e services/matching
          pip install -e "services/api[test]"
      - name: Apply database migrations
        working-directory: services/api
        run: alembic upgrade head
      - name: Run tests
        run: pytest services/intent/tests services/discovery/tests services/matching/tests services/api/tests
