name: Pyrintu API tests

on:
  pull_request:
    paths:
      - "services/api/**"
      - "services/intent/**"
      - ".github/workflows/api-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/intent/**"
      - ".github/workflows/api-tests.yml"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install intent domain and API
        run: |
          python -m pip install --upgrade pip
          pip install -e services/intent
          pip install -e "services/api[test]"
      - name: Run tests
        run: pytest services/intent/tests services/api/tests
