[project]
name = "pyrintu-intent"
version = "0.1.0"
description = "Pyrintu intent creation domain slice"
requires-python = ">=3.11"

dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
