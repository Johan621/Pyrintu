[project]
name = "pyrintu-ai-gateway"
version = "0.1.0"
description = "Provider-agnostic AI gateway for Pyrintu"
requires-python = ">=3.10"
dependencies = [
  "openai>=2.45.0,<3.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
